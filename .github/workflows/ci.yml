name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libenchant-2-2 hunspell-en-us
      - run: pip install -e ".[spell,test]"
      - name: Validate lexicon
        run: audiobook-lexicon validate
      - name: Tests
        run: pytest -q
